# --------------------------------------------------------------------------- #
# Category 2: cross-document near-misses -- the important ones
# --------------------------------------------------------------------------- #
#
# Each question below touches a topic (lockout, training, inspection
# intervals, or leaks) that genuinely appears in more than one ingested
# document. expected_source names the one document that actually answers
# THIS specific phrasing -- retrieval has to distinguish among similar
# candidates, not just find "something relevant".

- id: nearmiss-crane-loto-vs-osha-standard
  question: "What is the lockout/tagout procedure for the AS/RS stacker crane?"
  expected_source: "sample_crane_spec.md"
  expected_keywords: ["lockout"]
  notes: "Near-miss vs 1910.147.pdf (general LOTO standard) and the pump manual's own power-off instruction -- this phrasing asks about ONE specific machine's documented steps."

- id: nearmiss-osha-loto-standard-vs-crane
  question: "What must an employer establish as part of an OSHA energy control program?"
  expected_source: "1910.147.pdf"
  expected_keywords: ["energy control", "program"]
  notes: "Reverse direction of the case above -- general regulatory language, not the crane's specific steps."

- id: nearmiss-pump-power-off-vs-loto-standard
  question: "What must be done to the power supply before starting work on the SCALA2 pump?"
  expected_source: "SCALA2 Pump Manual.pdf"
  expected_keywords: ["power supply", "disconnect"]
  notes: "Near-miss vs 1910.147.pdf -- conceptually identical to general LOTO, but this phrasing names the specific product."

- id: nearmiss-pit-training-vs-other-training
  question: "What training must be completed before operating a powered industrial truck?"
  expected_source: "OSHA-2011-0062-0014_content.pdf"
  expected_keywords: ["training"]
  notes: "Near-miss vs 1910.147.pdf's LOTO training tiers and 1910.157's fire extinguisher training -- 'training' alone is a weak signal across this corpus."

- id: nearmiss-fireext-training-vs-other-training
  question: "How often must employees receive fire extinguisher education?"
  expected_source: "1910.157 - Portable fire extinguishers. _ Occupational Safety and Health Administration.pdf"
  expected_keywords: ["annually", "initial"]
  notes: "Reverse of the case above -- same 'training' topic, different correct document."

- id: nearmiss-crane-hoist-inspection-vs-others
  question: "What inspection interval applies to the hoist chain on the AS/RS crane?"
  expected_source: "sample_crane_spec.md"
  expected_keywords: ["hoist chain"]
  notes: "Near-miss vs 1910.147's annual LOTO inspection, 1910.157's monthly extinguisher inspection, and the PIT's daily inspection -- four documents, four different inspection cadences."

- id: nearmiss-pit-inspection-vs-others
  question: "How often must a powered industrial truck be inspected before use?"
  expected_source: "OSHA-2011-0062-0014_content.pdf"
  expected_keyword_groups: [["shift"], ["daily"]]
  notes: >
    Same inspection-interval confusion as above, different correct document
    and cadence (per-shift or daily, not monthly or annual). OR-groups:
    1910.178(q)(7) states this as two true clauses in the same subsection --
    "at least daily" (general case) and "after each shift" (round-the-clock
    case). Either is a fully correct answer; which one an answer leads with
    is a stylistic choice, not a correctness signal.

- id: nearmiss-loto-inspection-vs-others
  question: "How often must the lockout/tagout energy control procedure itself be inspected?"
  expected_source: "1910.147.pdf"
  expected_keywords: ["annual"]
  notes: "Third document in the inspection-interval near-miss cluster -- annual, distinct from the crane's monthly and the PIT's per-shift cadence."

- id: nearmiss-pit-fuel-leak-vs-pump-leak
  question: "What should be done if a powered industrial truck has a leak in its fuel system?"
  expected_source: "OSHA-2011-0062-0014_content.pdf"
  expected_keywords: ["leak"]
  notes: "Near-miss vs the SCALA2 pump manual's own leakage-indicator troubleshooting -- both documents discuss 'leaks' as a serious fault condition, in different equipment domains."

- id: nearmiss-pump-leak-vs-pit-leak
  question: "What does it mean if the SCALA2 pump's indicator shows leakage in the installation after the pump?"
  expected_source: "SCALA2 Pump Manual.pdf"
  expected_keywords: ["leakage"]
  notes: "Reverse of the case above -- same 'leak' topic, pump-specific troubleshooting rather than the PIT's out-of-service rule."

# --------------------------------------------------------------------------- #
# Category 3: hybrid retrieval / BM25 strength
# --------------------------------------------------------------------------- #
#
# Dense search embeds a whole chunk into one vector; a bare catalog number
# is one token among many and gets diluted by the surrounding prose. BM25
# has the opposite bias: a rare token that matches gets a large weight
# *because* it's rare. These cases are deliberately identifier-only queries
# (no topical words for dense search to lean on) against a real, unique
# token in the corpus -- verified empirically before being added: with
# HYBRID_ENABLED unset (dense-only, reranker off, default_top_k=5), the
# chunk containing the answer is entirely absent from the top 5; with
# HYBRID_ENABLED=true it's promoted straight into the pool. Document-level
# hit-rate can't show this (the SCALA2 pump manual has 50+ chunks, and
# several *other* chunks from it already rank in dense's top 5, so the
# document itself was never actually "missed") -- keyword pass-rate is
# what actually moves here, because it depends on which specific chunk
# reaches the LLM, not just which document.

- id: hybrid-pump-product-number-lookup
  question: "What is V6001176?"
  expected_source: "SCALA2 Pump Manual.pdf"
  expected_keywords: ["Castrol", "Optimol"]
  notes: >
    V6001176 is the Grundfos catalog number for "Castrol Optimol Paste
    White T, 0.5 kg" in the SCALA2 lubricants table (chunk 10) -- appears
    nowhere else in the corpus. Dense-only top-5 (HYBRID_ENABLED unset,
    RERANK_ENABLED=false) returns chunks 41, 3, 2, 42, and one OSHA chunk
    -- chunk 10 is absent entirely, so the answer isn't recoverable from
    context at all. With hybrid retrieval on, BM25's exact match on the
    literal token "v6001176" promotes chunk 10 into the pool. Note:
    RERANK_ENABLED=true (this repo's persistent default) independently
    rescues this specific case too, since the reranker's wide retrieve_n
    pool already happens to contain chunk 10 even without hybrid -- so
    this case is meant to be re-run with RERANK_ENABLED=false to isolate
    hybrid's own contribution, not the production-config table above.

