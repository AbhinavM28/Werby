# --------------------------------------------------------------------------- #
# Category 1: in-scope, deeper -- across the newly ingested documents
# --------------------------------------------------------------------------- #

- id: loto-inspection-frequency
  question: "How often must an energy control procedure be inspected under the lockout/tagout standard?"
  expected_source: "1910.147.pdf"
  expected_keywords: ["annual"]
  notes: "1910.147(c)(6)(i) -- periodic inspection, at least annually."

- id: loto-who-inspects
  question: "Who is permitted to perform the periodic inspection of a lockout energy control procedure?"
  expected_source: "1910.147.pdf"
  expected_keywords: ["authorized employee"]
  notes: "1910.147(c)(6)(i)(A) -- must be an authorized employee OTHER than the one(s) using the procedure being inspected."

- id: loto-training-tiers
  question: "What categories of employees must be trained under the lockout/tagout standard?"
  expected_source: "1910.147.pdf"
  expected_keywords: ["authorized", "affected"]
  notes: "1910.147(c)(7)(i) -- authorized, affected, and other employees."

- id: loto-tag-limitation
  question: "What is a key limitation of a tag compared to a lock under the lockout/tagout standard?"
  expected_source: "1910.147.pdf"
  expected_keyword_groups: [["warning", "restraint"], ["strength", "removal"]]
  notes: >
    OR-groups: the standard supports two distinct, equally valid true
    answers -- 1910.147(c)(7)(ii)(A) frames tags as warning devices without
    physical restraint; 1910.147(c)(5)(ii) frames the same limitation via
    minimum unlocking-strength and removability. Reranking legitimately
    shifted which clause the LLM's context led with (see the reranking
    benchmark keyword-regression investigation).

