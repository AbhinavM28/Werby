- id: out-of-scope-baseline
  question: "What's a good recipe for sourdough bread?"
  expected_source: null
  notes: >
    Deliberately unrelated to any ingested document. Its top score is the
    reference point for a future relevance threshold -- a real question
    scoring near this would mean retrieval is failing, not that the corpus
    simply lacks the answer.

- id: out-of-scope-car-maintenance
  question: "What is the recommended tire pressure for a Toyota Camry?"
  expected_source: null
  notes: "Same maintenance/spec-lookup genre as the real questions above, but a completely different equipment domain -- tests whether question *shape* alone drives up the score."

- id: out-of-scope-medical
  question: "What are the symptoms of seasonal allergies?"
  expected_source: null

- id: out-of-scope-networking
  question: "How do I set up a VPN on my home router?"
  expected_source: null

- id: out-of-scope-trivia
  question: "What is the boiling point of water at sea level?"
  expected_source: null

- id: out-of-scope-adjacent-osha-standard
  question: "What fall-protection height requirement applies to scaffolding?"
  expected_source: null
  notes: >
    Harder negative than the others: this is a real OSHA topic (1910.28,
    scaffolding/fall protection) in the same regulatory family as the
    ingested standards, but that standard itself was never ingested. Tests
    whether OSHA-flavored phrasing alone pulls the score up even without a
    real matching document -- the more informative kind of out-of-scope
    case now that the corpus is larger and more OSHA-heavy.
