# Werby evaluation dataset.
#
# Each entry is one test case for `python -m scripts.evaluate`. `expected_source`
# must match the exact filename VectorStore stored during ingestion (the literal
# filename passed to IngestionService.ingest()) -- these values match the corpus
# currently in data/chroma. Re-check these if you re-ingest under different names.
#
# expected_source: null marks a case as deliberately out-of-scope -- no
# source is expected to be found, and it's excluded from hit-rate, but its
# top retrieval score still feeds the in-scope/out-of-scope score gap.
#
# Grown 2026-07-28 for a stress test against a larger, more diverse corpus
# (added: 1910.147 lockout/tagout, 1910.157 portable fire extinguishers,
# 1910.212 machine guarding, and a Grundfos SCALA2 pump manual). Four
# sections below, in order:
#   1. In-scope, deeper -- straightforward questions against the new docs,
#      testing whether hit-rate holds as the corpus grows.
#   2. Cross-document near-misses -- the important ones. Topics (lockout,
#      training, inspection intervals, leaks) that appear in *multiple*
#      documents, phrased so retrieval must pick the one correct source
#      among genuinely similar candidates, not just "a relevant chunk".
#   3. Hybrid retrieval / BM25 strength -- exact-identifier lookups
#      (catalog/part numbers) designed to fail dense search specifically,
#      not just be "hard". See each case's notes for the verification.
#   4. True out-of-scope -- nothing in the corpus answers these. A mix of
#      totally alien topics and one OSHA-flavored-but-not-ingested question,
#      to see whether topical similarity alone (without real content) moves
#      the score.
#
# Every fact below was verified against the real ingested chunk text before
# being written -- not assumed from the source PDFs' filenames or general
# knowledge of the standards (see the SRM-4000/crane-spec correction earlier
# in this dataset's history for why that verification step matters).

- id: pit-daily-inspection
  question: "What must an operator check before operating a powered industrial truck each shift?"
  expected_source: "OSHA-2011-0062-0014_content.pdf"
  expected_keywords: ["inspection", "brakes", "shift"]
  notes: "Core pre-operation requirement, 1910.178(q)(7)."

- id: pit-operator-training
  question: "What training must an employee complete before operating a powered industrial truck?"
  expected_source: "OSHA-2011-0062-0014_content.pdf"
  expected_keywords: ["training", "certif"]
  notes: "Operator training and evaluation requirement, 1910.178(l)."

- id: pit-out-of-service
  question: "Under what conditions must a powered industrial truck be immediately removed from service?"
  expected_source: "OSHA-2011-0062-0014_content.pdf"
  expected_keywords: ["removed", "service"]
  notes: "Out-of-service triggers (e.g. leaking LP gas), 1910.178(q)."

- id: crane-rated-load
